server:
    port: 8081
spring:
    application:
        name: max-bcknd-java
    liquibase:
        change-log: classpath:db/changelog/liquibase.xml
    datasource:
        url: jdbc:postgresql://localhost:5432/timetable_max
        username: postgres
        password: postgres
    jpa:
        hibernate:
           ddl-auto: none
        properties:
            hibernate:
                format_sql: true
        show-sql: true